  <text x="750" y="405" fill="#fde68a" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day4</text>
  <text x="930" y="405" fill="#fdba74" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day5</text>
  <text x="1110" y="405" fill="#a1a1aa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day6</text>
  <text x="1290" y="405" fill="#a1a1aa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day7</text>

  <text x="210" y="456" fill="#d6d3d1" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">个人探索</text>
  <text x="390" y="456" fill="#d6d3d1" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">联盟组队</text>
  <text x="660" y="456" fill="#fde68a" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">组织能力成长</text>
  <text x="930" y="456" fill="#fdba74" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">内圆 GVE 主峰释放</text>

  <rect x="1090" y="468" width="403" height="88" rx="16" fill="#292524" fill-opacity="0.70" stroke="#57534e" stroke-width="2"/>
  <text x="1291" y="522" fill="#fcd34d" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">节奏特征：先 L1/L2，再外圆 GvG，最后内圆 GVE</text>
