<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CP-B 慢转时间轴效果示意图</title>
  <desc id="desc">组织先蓄水再分段爆发：Day3 练习、Day4 外圆 GvG、Day5 内圆 GVE 主峰</desc>
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#2a1d0a"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="curveB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glowB" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.52"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="url(#bgB)"/>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="none" stroke="#3f3f46" stroke-width="2"/>
  <rect x="62" y="54" width="274" height="62" rx="31" fill="#f59e0b" fill-opacity="0.20" stroke="#fcd34d" stroke-width="2"/>
  <text x="199" y="96" fill="#fde68a" font-size="33" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">CP-B 慢转</text>
  <text x="800" y="96" fill="#f8fafc" font-size="39" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3 练习 → Day4 外圆 GvG → Day5 内圆 GVE 峰值</text>

  <line x1="170" y1="350" x2="1430" y2="350" stroke="url(#lineB)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M210 350 C350 346 505 326 570 300 C645 268 705 248 750 234 C810 212 874 196 930 188 C1000 180 1110 230 1290 292"
