  <circle cx="390" cy="344" r="20" fill="#a8a29e"/>
  <circle cx="570" cy="300" r="26" fill="#fbbf24"/>
  <circle cx="750" cy="234" r="28" fill="#f59e0b"/>
  <circle cx="930" cy="188" r="34" fill="#d97706" filter="url(#glowB)"/>
  <circle cx="1110" cy="230" r="24" fill="#fbbf24"/>
  <circle cx="1290" cy="292" r="22" fill="#fde68a"/>

