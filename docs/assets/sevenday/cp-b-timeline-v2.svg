  <line x1="932" y1="176" x2="930" y2="190" stroke="#f59e0b" stroke-width="3"/>

  <rect x="656" y="146" width="188" height="62" rx="14" fill="#292524" fill-opacity="0.75" stroke="#fbbf24" stroke-width="2"/>
