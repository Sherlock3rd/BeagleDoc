<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GVE 环状地块结构效果示意图</title>
  <desc id="desc">带光效与动线提示的环状结构图，展示外圆 GvG、内圆 GVE 与外围 PVE 连接关系</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1122"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <radialGradient id="haloOuter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloMid" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ringCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#60a5fa" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#fb923c" flood-opacity="0.50"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1560" height="860" rx="34" fill="url(#bg)"/>
  <rect x="20" y="20" width="1560" height="860" rx="34" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="800" y="92" fill="#e2e8f0" font-size="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">GVE 环状地块结构 · 效果示意图</text>
  <text x="800" y="134" fill="#93c5fd" font-size="25" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">双圈本体：外圆 GvG + 内圆 GVE，外围仅为 PVE 连接</text>

  <circle cx="800" cy="470" r="338" fill="url(#haloOuter)"/>
  <circle cx="800" cy="470" r="290" fill="none" stroke="url(#ringOuter)" stroke-width="30" opacity="0.80" filter="url(#glowBlue)"/>
  <circle cx="800" cy="470" r="122" fill="url(#ringCore)" filter="url(#glowBlue)"/>
  <circle cx="800" cy="470" r="332" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 14"/>

  <path d="M555 320 C630 270 710 252 790 250" fill="none" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M980 610 C910 666 832 690 760 682" fill="none" stroke="#fb923c" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M690 505 C708 534 742 552 780 558" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <text x="800" y="462" fill="#f8fafc" font-size="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">内圆 GVE 协作峰值</text>
  <text x="800" y="503" fill="#dbeafe" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">多人分工 / 共同结算 / 目标兑现</text>
  <text x="800" y="582" fill="#ffedd5" font-size="33" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">外圆 GvG 战斗圈</text>
  <text x="800" y="621" fill="#fed7aa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">争夺 · 协商 · 占位 · 结盟</text>
  <text x="800" y="246" fill="#bfdbfe" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" text-anchor="middle">外围连接到常规 PVE 地块</text>

  <rect x="84" y="220" width="366" height="168" rx="22" fill="#0f172a" fill-opacity="0.78" stroke="#60a5fa" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="268" y="280" fill="#93c5fd" font-size="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">外围 PVE 连接</text>
  <text x="268" y="326" fill="#cbd5e1" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">安全回流 / 探索集合 / 快速补员</text>
  <path d="M450 304 C535 332 602 360 642 392" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="1144" y="286" width="372" height="170" rx="22" fill="#1c1917" fill-opacity="0.78" stroke="#fb923c" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="1330" y="347" fill="#fdba74" font-size="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">外圆 GvG</text>
  <text x="1330" y="392" fill="#fed7aa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">联盟对抗 / 资格竞争 / 进入判定</text>
  <path d="M1144 402 C1070 430 1025 452 968 474" fill="none" stroke="#fb923c" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <rect x="1144" y="522" width="372" height="162" rx="22" fill="#0f172a" fill-opacity="0.80" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="1330" y="580" fill="#7dd3fc" font-size="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">内圆 GVE</text>
  <text x="1330" y="624" fill="#bae6fd" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">协作挑战 / 战果转化 / 峰值体验</text>
  <path d="M1144 590 C1050 562 996 540 930 512" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
</svg>
