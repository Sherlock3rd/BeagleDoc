<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CP-A 快转时间轴效果示意图</title>
  <desc id="desc">带强度曲线与高亮节点的快转方案示意，Day3 为启动点，Day4 达到协作峰值，Day5-7 为外圆/内圆轮转验证</desc>
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1327"/>
      <stop offset="100%" stop-color="#142c4a"/>
    </linearGradient>
    <linearGradient id="lineA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="curveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#60a5fa" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="url(#bgA)"/>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="62" y="54" width="274" height="62" rx="31" fill="#1d4ed8" fill-opacity="0.24" stroke="#93c5fd" stroke-width="2"/>
  <text x="199" y="96" fill="#bfdbfe" font-size="33" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">CP-A 快转</text>
  <text x="800" y="96" fill="#e2e8f0" font-size="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3 快转启动，Day4 达到协作峰值，Day5-7 外圆/内圆轮转验证</text>

  <line x1="170" y1="350" x2="1430" y2="350" stroke="url(#lineA)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M210 350 C330 340 470 306 570 282 C645 264 705 232 750 206 C812 218 875 232 930 244 C995 248 1080 268 1290 302"
        fill="none" stroke="url(#curveA)" stroke-width="8" stroke-linecap="round" filter="url(#glowA)"/>
  <path d="M210 350 C330 340 470 306 570 282 C645 264 705 232 750 206 C812 218 875 232 930 244 C995 248 1080 268 1290 302 L1290 350 L210 350 Z"
        fill="#1d4ed8" fill-opacity="0.18"/>

  <circle cx="210" cy="350" r="20" fill="#94a3b8"/>
  <circle cx="390" cy="334" r="22" fill="#60a5fa"/>
  <circle cx="570" cy="282" r="26" fill="#2563eb" filter="url(#glowA)"/>
  <circle cx="750" cy="206" r="30" fill="#1d4ed8" filter="url(#glowA)"/>
  <circle cx="930" cy="244" r="26" fill="#3b82f6" filter="url(#glowA)"/>
  <circle cx="1110" cy="268" r="22" fill="#60a5fa"/>
  <circle cx="1290" cy="302" r="22" fill="#93c5fd"/>

  <rect x="482" y="138" width="176" height="62" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#60a5fa" stroke-width="2"/>
  <text x="570" y="179" fill="#bfdbfe" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3 快转启动</text>
  <line x1="570" y1="200" x2="570" y2="278" stroke="#60a5fa" stroke-width="3"/>

  <rect x="654" y="108" width="190" height="62" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#38bdf8" stroke-width="2"/>
  <text x="749" y="149" fill="#bae6fd" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day4 协作峰值</text>
  <line x1="749" y1="170" x2="750" y2="204" stroke="#38bdf8" stroke-width="3"/>

  <text x="210" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day1</text>
  <text x="390" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day2</text>
  <text x="570" y="405" fill="#bfdbfe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3</text>
  <text x="750" y="405" fill="#bfdbfe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day4</text>
  <text x="930" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day5</text>
  <text x="1110" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day6</text>
  <text x="1290" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day7</text>

  <text x="210" y="456" fill="#cbd5e1" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">个人探索</text>
  <text x="390" y="456" fill="#cbd5e1" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">加入联盟</text>
  <text x="570" y="456" fill="#dbeafe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">外圆 GvG 准入战</text>
  <text x="750" y="456" fill="#dbeafe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">内圆 GVE 首开</text>
  <text x="930" y="456" fill="#dbeafe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">峰后外圆/内圆轮转</text>

  <rect x="1115" y="468" width="378" height="88" rx="16" fill="#0f172a" fill-opacity="0.70" stroke="#334155" stroke-width="2"/>
  <text x="1304" y="522" fill="#93c5fd" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">节奏特征：Day3 启动，Day4 见峰，Day5-7 轮转验证</text>
</svg>
