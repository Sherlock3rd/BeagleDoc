<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CP1 完整七日规划时间轴示意图</title>
  <desc id="desc">Day3 合作行动（GVE 首轮，无争夺性），Day4 合作行动（GVE 继续推进，为后续 GvG 积累资源与阵地），Day5-7 城镇争夺 GvG 开启（维持高位强社交）</desc>
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1327"/>
      <stop offset="100%" stop-color="#142c4a"/>
    </linearGradient>
    <linearGradient id="lineA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="curveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#60a5fa" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="url(#bgA)"/>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="none" stroke="#334155" stroke-width="2"/>

  <line x1="170" y1="350" x2="1430" y2="350" stroke="url(#lineA)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M210 350 C330 340 470 306 570 250 C645 220 705 232 750 216 C812 198 875 160 930 160 C995 160 1080 160 1290 160"
        fill="none" stroke="url(#curveA)" stroke-width="8" stroke-linecap="round" filter="url(#glowA)"/>
  <path d="M210 350 C330 340 470 306 570 250 C645 220 705 232 750 216 C812 198 875 160 930 160 C995 160 1080 160 1290 160 L1290 350 L210 350 Z"
        fill="#1d4ed8" fill-opacity="0.18"/>

  <circle cx="210" cy="350" r="20" fill="#94a3b8"/>
  <circle cx="390" cy="334" r="22" fill="#60a5fa"/>
  <circle cx="570" cy="250" r="26" fill="#2563eb" filter="url(#glowA)"/>
  <circle cx="750" cy="216" r="30" fill="#1d4ed8" filter="url(#glowA)"/>
  <circle cx="930" cy="160" r="32" fill="#3b82f6" filter="url(#glowA)"/>
  <circle cx="1110" cy="160" r="32" fill="#60a5fa" filter="url(#glowA)"/>
  <circle cx="1290" cy="160" r="32" fill="#93c5fd" filter="url(#glowA)"/>

  <rect x="470" y="128" width="200" height="62" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#60a5fa" stroke-width="2"/>
  <text x="570" y="169" fill="#bfdbfe" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3 GVE 首开</text>
  <line x1="570" y1="190" x2="570" y2="246" stroke="#60a5fa" stroke-width="3"/>

  <rect x="634" y="68" width="230" height="62" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#38bdf8" stroke-width="2"/>
  <text x="749" y="109" fill="#bae6fd" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day4 GVE 推进</text>
  <line x1="749" y1="130" x2="750" y2="212" stroke="#38bdf8" stroke-width="3"/>

  <rect x="980" y="58" width="260" height="62" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#93c5fd" stroke-width="2"/>
  <text x="1110" y="99" fill="#e2e8f0" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day5-7 城镇争夺 GvG</text>
  <line x1="1110" y1="120" x2="1110" y2="156" stroke="#93c5fd" stroke-width="3"/>

  <text x="210" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day1</text>
  <text x="390" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day2</text>
  <text x="570" y="405" fill="#bfdbfe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3</text>
  <text x="750" y="405" fill="#bfdbfe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day4</text>
  <text x="930" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day5</text>
  <text x="1110" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day6</text>
  <text x="1290" y="405" fill="#94a3b8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day7</text>

  <text x="210" y="456" fill="#cbd5e1" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">个人探索</text>
  <text x="390" y="456" fill="#cbd5e1" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">进入联盟</text>
  <text x="570" y="456" fill="#dbeafe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">GVE 首开</text>
  <text x="750" y="456" fill="#dbeafe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">合作行动与推进</text>
  <text x="1100" y="456" fill="#dbeafe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">城镇争夺 GvG 开启并维持高位</text>

</svg>
