<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CP-C 佛系慢转时间轴效果示意图</title>
  <desc id="desc">前 5 天禁入并迷雾遮挡，Day6 同步开放内外圆形成单次峰值</desc>
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120923"/>
      <stop offset="100%" stop-color="#24103e"/>
    </linearGradient>
    <linearGradient id="lineC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="curveC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowC" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.58"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="url(#bgC)"/>
  <rect x="20" y="20" width="1560" height="580" rx="30" fill="none" stroke="#4c1d95" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="62" y="54" width="334" height="62" rx="31" fill="#a855f7" fill-opacity="0.20" stroke="#d8b4fe" stroke-width="2"/>
  <text x="229" y="96" fill="#e9d5ff" font-size="32" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">CP-C 佛系慢转</text>
  <text x="800" y="96" fill="#f5f3ff" font-size="39" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">前 5 天禁入+迷雾，Day6 同步开放内外圆</text>

  <line x1="170" y1="350" x2="1430" y2="350" stroke="url(#lineC)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M210 350 C370 348 500 346 570 344 C650 342 715 340 750 338 C830 334 884 332 930 330 C1010 320 1082 270 1110 206 C1160 240 1224 274 1290 298"
        fill="none" stroke="url(#curveC)" stroke-width="8" stroke-linecap="round" filter="url(#glowC)"/>
  <path d="M210 350 C370 348 500 346 570 344 C650 342 715 340 750 338 C830 334 884 332 930 330 C1010 320 1082 270 1110 206 C1160 240 1224 274 1290 298 L1290 350 L210 350 Z"
        fill="#a855f7" fill-opacity="0.16"/>

  <circle cx="210" cy="350" r="20" fill="#9ca3af"/>
  <circle cx="390" cy="348" r="20" fill="#a78bfa"/>
  <circle cx="570" cy="344" r="20" fill="#c4b5fd"/>
  <circle cx="750" cy="338" r="20" fill="#d8b4fe"/>
  <circle cx="930" cy="330" r="22" fill="#ddd6fe"/>
  <circle cx="1110" cy="206" r="36" fill="#7c3aed" filter="url(#glowC)"/>
  <circle cx="1290" cy="298" r="22" fill="#c084fc"/>

  <rect x="990" y="122" width="240" height="62" rx="14" fill="#2e1065" fill-opacity="0.72" stroke="#d8b4fe" stroke-width="2"/>
  <text x="1110" y="163" fill="#e9d5ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day6 同步开放</text>
  <line x1="1110" y1="184" x2="1110" y2="204" stroke="#d8b4fe" stroke-width="3"/>

  <rect x="470" y="392" width="220" height="62" rx="14" fill="#2e1065" fill-opacity="0.70" stroke="#c4b5fd" stroke-width="2"/>
  <text x="580" y="433" fill="#ddd6fe" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3-5 禁入迷雾</text>
  <line x1="580" y1="392" x2="570" y2="346" stroke="#c4b5fd" stroke-width="3"/>

  <text x="210" y="405" fill="#a1a1aa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day1</text>
  <text x="390" y="405" fill="#a1a1aa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day2</text>
  <text x="570" y="405" fill="#ddd6fe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day3</text>
  <text x="750" y="405" fill="#ddd6fe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day4</text>
  <text x="930" y="405" fill="#ddd6fe" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day5</text>
  <text x="1110" y="405" fill="#e9d5ff" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">Day6</text>
  <text x="1290" y="405" fill="#a78bfa" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Day7</text>

  <text x="210" y="456" fill="#d4d4d8" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">个人探索</text>
  <text x="390" y="456" fill="#d4d4d8" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">联盟接入</text>
  <text x="660" y="456" fill="#ddd6fe" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">低压探索 / 迷雾禁入</text>
  <text x="1110" y="456" fill="#e9d5ff" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">内外圆同步开启</text>

  <rect x="1088" y="468" width="405" height="88" rx="16" fill="#2e1065" fill-opacity="0.68" stroke="#6d28d9" stroke-width="2"/>
  <text x="1290" y="522" fill="#d8b4fe" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">节奏特征：前置禁入保护，Day6 一次性揭示与开放</text>
</svg>
