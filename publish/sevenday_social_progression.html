const md = `# 七日版本社交渐进与地图玩法 CP 文档

## 1. 设计背景与现状
- 背景：7日版本需明确“每天玩家在社交上的状态与所玩内容”，并统一联盟关系的渐进方式（小队→联盟），避免从渗透社交到强对抗的断层。CEO 提出需要在七日版本中**验证 SLG 用户的转化率**，因此需**加入 SLG 玩法验证**，考察用户对更强对抗（阵营/联盟协作、场地竞争）的接受度与留存影响。
- 现状：Day1~2 在分线岛，以安全 PVE 与小队探索为主；Day2 晚解锁联盟；Day1 解锁五人小队副本（P0）与异步/离线助战（P1）；L1/L2 PVP 地块计划在 Day3 开启。
- 讨论范围：确定 GVE 地块开启时间与落位、确定外围 PVP 的承载目的（局部 PVP vs 联盟单位 GvG）、定义联盟社交从对抗到合作的过渡件与最小改动方案。

## 2. 设计目的
- 明确地图玩法的“渐进框架”，以联盟为友军集合，建立可复用的七日社交与战斗节奏。
- 以风险分层与分流工具（L1/L2）承接公共 PVP，避免过早引入领土政治与高惩罚。
- 在 7 日周期内逐步建立组织化协作认知，形成稳定的联盟社交闭环。
- 核心新增目的：确定“耐受度验证方案”，并对齐“耐受度映射的数据指标”，用于解释玩家在不同强度 SLG 内容下的参与、留存与流失阈值。

### 地块定义与结构（共识）
- PVE 地块：安全探索与资源产出区域，玩家自由进出，无对抗压力。
- PVP 地块（联盟单位，小中规模）：以联盟为单位的玩家对战区域；采用 AllianceID 友军免伤与跨盟红名判定；按 L1（常驻低风险）/L2（整点中风险短窗）分层，不承载领土政治，侧重热度与规则演练。
- GvG 地块（联盟单位，中大规模，独立场景）：以联盟为单位的更大规模对战场景；独立地块与规则集，强调组织化与场景设计（占点/旗帜/评分/整点）；早期以“预演地块”为主（短窗、荣誉/装饰为主），避免过早绑定数值通道与领土政治。
- GVE 地块（特殊结构）：
  - 核心定位：多人协作挑战与进阶资源产出区域。
  - 结构共识：包含内外两圈结构（外圆 GvG 用于争取内圆 GVE 准入），此物理结构在所有 CP 方案中均存在，但各方案对双圈的开启方式与预期体验有所不同。
  - 地块连接：连接到常规 PVE 地块（安全主干道与周边探索）。

## 3. CP 方案总览（按改动 Scope 重新划分）
- CP1（最大 Scope）：完整 7 日规划 + 新增城镇争夺型 GvG + 联盟进程规划，重点观测 7 留与 SLG 元素参与率。
- CP2（中等 Scope）：在现有内容上增加“联盟攻城”强协作玩法，提前验证联盟强社交生态。
- CP3（最小 Scope）：保持现有内容并做节奏拆分（原 CP-B），重点观测分段递进对 SLG 参与率的拉升效果。
- 统一约束：CP1 与 CP2 都不拆分已有 GVE 地块玩法解锁。
- 对标口径：CP 内“城镇 PVE/城镇 PVP”主要对标《三谋》的城镇玩法；仅 CP1 中 GvG 地块的扩展争夺玩法可参考 RoK/CoD 的领土争夺模块。

## 4. CP1（最大 Scope：完整七日规划 + 城镇争夺 GvG）
### 4.1 一句话玩家体验
- 从 Day3 开始快速进入“联盟组织化作战”，在完整七日节奏中体验“对抗夺点—协作产出—联盟成长”的强目标闭环。

### 4.2 耐受度映射指标
  | 映射维度 | 指标口径 | 耐受度判定 |
  | :--- | :--- | :--- |
  | **强对抗耐受** | 城镇争夺 GvG 到场率、连续参与场次、人均战斗时长 | 判断玩家对高压联盟对抗的可持续承受阈值。 |
  | **强协作耐受** | GVE 到场率/完成率、联盟内分工覆盖率 | 判断玩家对高组织成本协作链路的接受度。 |
  | **转化耐受** | SLG 元素参与率（攻城、驻防、集结指令响应）、7 日留存（7留） | 判断“高强度 SLG 导入”是否造成转化提升或流失放大。 |
  | **情绪耐受** | 失败后次日回流率、负反馈关键词占比 | 判断高压失败体验对留存心智的冲击。 |

### 4.3 新增内容 Scope

<blockquote class="highlight-box">
<p><strong>新增玩法模块</strong></p>
<ul>
<li>新增“城镇争夺型 GvG”、“特殊争夺点 GvG”或“领土”玩法模块（联盟单位争夺）。</li>
<li>对标参考：城镇 PVE/PVP 主要对标参考《三谋》的城镇玩法；领土/特殊点争夺主要对标参考 Rise of Kingdoms、Call of Dragons 的领土争夺模块。</li>
</ul>
<p><strong>已有内容修改</strong></p>
<ul>
<li>GVE 地块需改为纯 GVE 区域，不再具备 PVP 属性；作为前置的联盟协作玩法存在，承担联盟协作的渐进功能。</li>
</ul>
</blockquote>

### 4.4 渐进体验轴（时间轴）
  - Day1-2 个人探索
  - Day2 晚 进入联盟
  - Day3 合作行动（GVE 首轮，无争夺性）
  - Day4 合作行动（GVE 继续推进，为后续 GvG 积累资源与阵地）
  - Day5-7 城镇争夺 GvG 开启（维持高位强社交）

### 4.5 方案优缺点评估
  | 评估维度 | 具体表现 |
  | :--- | :--- |
  | **优势 (Pros)** | 验证最完整、最准确，可同时覆盖 7 留、SLG 参与率、联盟组织化上限。 |
  | **劣势 (Cons)** | 开发与调参成本最高，对泛用户承压要求高，防流失机制依赖更强。 |

## 5. CP2（中等 Scope：现有内容 + 联盟攻城前置强协作）
### 5.1 一句话玩家体验
- 在不重做主链路的前提下，先经历一次“联盟协作攻城并迁城”的强协作事件，再进入 GVE 解锁阶段。

### 5.2 耐受度映射指标
  | 映射维度 | 指标口径 | 耐受度判定 |
  | :--- | :--- | :--- |
  | **协作耐受** | 联盟攻城集结成功率、攻城参与深度、迁城执行率 | 判断玩家是否能接受前置高协作门槛。 |
  | **SLG 参与耐受** | 攻城后 SLG 内容参与率、联盟目标跟随率 | 判断“先强协作再解锁”是否提升 SLG 参与黏性。 |
  | **节奏耐受** | 攻城触发后流失率、次日回流率 | 判断前置强协作是否造成节奏断层或挫败。 |

### 5.3 新增内容 Scope

<blockquote class="highlight-box">
<p><strong>新增玩法模块</strong></p>
<ul>
<li>新增“联盟攻城玩法”：同联盟协作攻城后方可占领城市并迁城。</li>
<li>新增“攻城成功→城市占领→迁城”链路的状态反馈与权限结算。</li>
<li>对标参考：城镇攻防与迁城相关链路主要对标参考《三谋》。</li>
</ul>
<p><strong>已有内容修改</strong></p>
<ul>
<li>内外圈拆分分批次开启，外圈 GvG 先开启，并且外圈场地需要承载 GvG 属性。</li>
<li>PVP L2 地块要增加联盟对抗的动机，需要修改并调整投放内容。</li>
</ul>
</blockquote>

### 5.4 渐进体验轴（时间轴）
  - Day1-2 个人探索
  - Day2 晚 进入联盟
  - Day3 攻城筹备
  - Day4 城镇占领（联盟协作组织，对抗强度中等）
  - Day5 外圈 GvG 开启（强对抗，验证 GvG 接受度）
  - Day6-7 内圈 GVE 开启（达到社交协作峰值）

### 5.5 方案优缺点评估
  | 评估维度 | 具体表现 |
  | :--- | :--- |
  | **优势 (Pros)** | 在现有框架上较快落地，能更早验证联盟强社交生态与 SLG 参与拉升。 |
  | **劣势 (Cons)** | 攻城节点若反馈不佳会影响后续 GVE 体验，需精控奖励与门槛。 |

## 6. CP3（最小 Scope：保持现有内容的分段递进）
### 6.1 一句话玩家体验
- 先练习、再准入、后爆发，按 Day3→Day4→Day5 的分段节奏平滑进入强协作内容。

### 6.2 耐受度映射指标
  | 映射维度 | 指标口径 | 耐受度判定 |
  | :--- | :--- | :--- |
  | **练习段耐受** | Day3 L1/L2 参与率、首战完成率 | 判断低门槛 PVP 练习是否有效降低后续门槛。 |
  | **准入段耐受** | Day4 外圆 GvG 到场率、败退后回流率 | 判断中压对抗阶段的可接受区间。 |
  | **爆发段耐受** | Day5 内圆 GVE 到场率/完成率、SLG 元素参与率 | 判断递进节奏是否成功导入核心 SLG 行为。 |

### 6.3 新增内容 Scope

<blockquote class="highlight-box">
<p><strong>新增玩法模块</strong></p>
<ul>
<li>无新增核心系统，延续现有 CP-B 框架与节奏拆分。</li>
<li>对标参考：分层风险区递进主要对标参考 Albion Online；分层组队内容过渡主要对标参考 World of Warcraft。</li>
</ul>
<p><strong>已有内容修改</strong></p>
<ul>
<li>内外圈拆分分批次开启，外圈 GvG 先开启，并且外圈场地需要承载 GvG 属性。</li>
<li>PVP L2 地块要增加联盟对抗的动机，需要修改并调整投放内容。</li>
</ul>
</blockquote>

### 6.4 渐进体验轴（时间轴）
  - Day1-2 个人探索
  - Day2 晚 进入联盟
  - Day3 L1/L2 练习
  - Day4 外圆 GvG 准入
  - Day5 内圆 GVE 爆发

### 6.5 方案优缺点评估
  | 评估维度 | 具体表现 |
  | :--- | :--- |
  | **优势 (Pros)** | 改动最小、风险最低、最快形成可观测样本，适合快速迭代。 |
  | **劣势 (Cons)** | 验证深度有限，对“高强度 SLG 耐受上限”的覆盖不如 CP1/CP2。 |

### 7.2 总结与共识约束

<p><strong>核心观测指标共识</strong><br>
无论最终选择哪个方案，以下数据口径是必须统一追踪的底线：</p>
<ol>
<li><strong>商业/留存底线</strong>：7 日留存率（7留）与次日回流率。</li>
<li><strong>玩法转化率</strong>：SLG 元素参与率（到场、集结、攻城等动作）。</li>
<li><strong>耐受度解释</strong>：结合各方案专属的“耐受度映射指标”（如连败后流失、分工覆盖率），来解释核心指标的波动原因。</li>
</ol>

<p><strong>地块与解锁规则约束</strong></p>
<ul>
<li><strong>GVE 结构差异</strong>：物理结构上均为内外双圈。但在体验预期上：CP1 将双圈合并视为纯粹的联盟协作整体，弱化甚至不体现外圈的阻挡与对抗概念；CP2 和 CP3 保留明确的内外圈分割，外圈具备 GvG 属性并先于内圈 GVE 开启，作为对抗验证或准入门槛。</li>
<li><strong>解锁策略底线</strong>：所有方案均不拆分现有 GVE 地块的底层解锁逻辑，新增的对抗或协作玩法仅作为“外挂式增强”或“前置门禁”。</li>
</ul>
`;
function preprocessMd(rawMd) {
  return rawMd
    .replace(/^# .+\n+/m, '')
    .replace(/^- 统一约束：CP1 与 CP2 都不拆分已有 GVE 地块玩法解锁。\n?/m, '')
    .replace(/^- 对标口径：CP 内“城镇 PVE\/城镇 PVP”主要对标《三谋》的城镇玩法；仅 CP1 中 GvG 地块的扩展争夺玩法可参考 RoK\/CoD 的领土争夺模块。\n?/m, '')
    .replace(/### 4\.4 渐进体验轴（时间轴）\n[\s\S]*?(?=### 4\.5)/m, '### 4.4 渐进体验轴（时间轴）\n\n')
    .replace(/### 5\.4 渐进体验轴（时间轴）\n[\s\S]*?(?=### 5\.5)/m, '### 5.4 渐进体验轴（时间轴）\n\n')
    .replace(/### 6\.4 渐进体验轴（时间轴）\n[\s\S]*?(?=### 6\.5)/m, '### 6.4 渐进体验轴（时间轴）\n\n');
}

const contentEl = document.getElementById('content');
contentEl.innerHTML = marked.parse(preprocessMd(md));

// Mermaid: transform <pre><code class="language-mermaid">...</code></pre> to <div class="mermaid">...</div>
contentEl.querySelectorAll('pre code.language-mermaid').forEach(code => {
  const pre = code.parentElement;
  const container = document.createElement('div');
  container.className = 'mermaid';
  container.textContent = code.textContent;
  pre.replaceWith(container);
});
mermaid.initialize({ startOnLoad: true, securityLevel: 'loose' });

contentEl.querySelectorAll('table').forEach(table => {
  if (table.parentElement && table.parentElement.classList.contains('table-wrapper')) return;
  const wrapper = document.createElement('div');
  wrapper.className = 'table-wrapper';
  table.parentNode.insertBefore(wrapper, table);
  wrapper.appendChild(table);
});

const h2List = Array.from(contentEl.querySelectorAll('h2'));
h2List.forEach(h2 => {
  const section = document.createElement('section');
  section.className = 'section-block';
  h2.parentNode.insertBefore(section, h2);
  section.appendChild(h2);
  let cursor = section.nextSibling;
  while (cursor && !(cursor.nodeType === 1 && cursor.tagName === 'H2')) {
    const next = cursor.nextSibling;
    section.appendChild(cursor);
    cursor = next;
  }
});

function insertVisualAfter(targetEl, imgSrc, altText, noteText) {
  if (!targetEl) return;
  const wrap = document.createElement('div');
  wrap.className = 'scene-container';
  let noteHtml = '';
  if (noteText) {
      noteHtml = `<div class="figure-note">${noteText}</div>`;
  }
  wrap.innerHTML = `
    <div class="visual-scene">
      <img class="visual-image" src="${imgSrc}" alt="${altText}">
    </div>
    ${noteHtml}
  `;
  targetEl.insertAdjacentElement('afterend', wrap);
}

const h3List = Array.from(contentEl.querySelectorAll('h3'));

const mapHeading = h3List.find(el => el.textContent.trim() === '地块定义与结构（共识）');
insertVisualAfter(
  mapHeading,
  '../docs/assets/sevenday/gve-ring-structure-v2.svg',
  'GVE 环状地块结构图',
  ''
);

function insertAxisByCpSection(cpKey, imgSrc, altText, noteText) {
  const section = Array.from(contentEl.querySelectorAll('.section-block')).find(s => {
    const h2 = s.querySelector('h2');
    return h2 && h2.textContent.includes(cpKey);
  });
  if (!section) return;
  const axisHeading = Array.from(section.querySelectorAll('h3, h4')).find(heading => heading.textContent.includes('渐进体验轴（时间轴）'));
  let anchor = section.querySelector('h2');
  if (axisHeading) {
    anchor = axisHeading;
  }
  insertVisualAfter(anchor, imgSrc, altText, noteText);
}

insertAxisByCpSection('CP1', '../docs/assets/sevenday/cp-a-timeline-v2.svg?v=cp1-20260401', 'CP1 渐进体验轴', '');
insertAxisByCpSection('CP2', '../docs/assets/sevenday/cp-c-timeline-v2.svg?v=cp2-20260401', 'CP2 渐进体验轴', '');
insertAxisByCpSection('CP3', '../docs/assets/sevenday/cp-b-timeline-v2.svg?v=cp3-20260401', 'CP3 渐进体验轴', '');
</script>
